name: Bug 报告
description: 报告可复现的功能、兼容性或界面问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索已有 Issue。安全漏洞请按 [安全政策](https://github.com/qy4747/win-control-desk/blob/main/SECURITY.md) 私下报告。
        示例和附件请按其中的脱敏规则处理，保留复现所需的命令结构和进程对应关系。
  - type: input
    id: version
    attributes:
      label: 总控台版本或 commit
      placeholder: 例如 1.0.0 或 abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python 和浏览器版本
      placeholder: Windows 11 / Python 3.12 / Chrome
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 打开……
        2. 添加示例……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 相关日志或截图
      description: 提供脱敏后的相关片段
  - type: textarea
    id: notes
    attributes:
      label: 其他信息
      description: 如最近一次正常版本或临时规避方式
