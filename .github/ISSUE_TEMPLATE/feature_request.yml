name: 功能建议
description: 提议一个本地启动、任务或监测场景
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索已有建议。示例和附件遵循 [脱敏规则](https://github.com/qy4747/win-control-desk/blob/main/SECURITY.md#脱敏规则)。
  - type: textarea
    id: scenario
    attributes:
      label: 用户场景
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述结果，不必预先限定技术实现
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方式
      description: 当前如何处理，为什么仍不够好？
  - type: textarea
    id: notes
    attributes:
      label: 补充信息
      description: 例如使用频率、界面示例或兼容性需求
